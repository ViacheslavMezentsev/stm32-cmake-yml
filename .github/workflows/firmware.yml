name: Firmware

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - stm32_yml.cmake
      - cmake/**
      - scripts/**
      - ci/**
      - tests/firmware/**
      - tests/test_firmware*.py
      - .github/workflows/firmware.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check result classification
        run: python3 -m unittest discover -s tests -p "test_firmware*.py"
      - name: Build compiler and emulator images
        run: |
          mkdir -p build/firmware-smoke build/firmware-qemu
          set -o pipefail
          docker build --platform linux/amd64 --progress plain -f ci/docker/Dockerfile -t stm32-yml-ci:firmware . 2>&1 | tee build/firmware-compiler-image.log
          docker build --platform linux/amd64 --progress plain -t stm32-yml-emulation:firmware ci/emulation 2>&1 | tee build/firmware-emulator-image.log
      - name: Build three profiles on every locked GCC/CMake pair
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --mount "type=bind,source=$PWD/build/firmware-smoke,target=/results" \
            stm32-yml-ci:firmware python3 /workspace/ci/firmware_matrix.py build --output /results
      - name: Check pinned emulators offline
        run: docker run --rm --network none stm32-yml-emulation:firmware
      - name: Run QEMU with explicit result and timeout checks
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --mount "type=bind,source=$PWD/build/firmware-qemu,target=/results" \
            stm32-yml-emulation:firmware python3 /workspace/ci/firmware_matrix.py run \
              --build /workspace/build/firmware-smoke --output /results
      - name: Upload build and execution diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-semihosting
          retention-days: 14
          path: |
            build/firmware-smoke/
            build/firmware-qemu/
            build/firmware-*-image.log
