name: Firmware

on:
  # Full matrix (~24 min): run manually at stage boundaries and before a release
  # (Run workflow on main updates the badge); a v* tag re-checks the tagged commit.
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Configure/Build (TC-44, E010 limitation)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Windows installer guards
        run: python -m unittest discover -s tests -p test_windows_tools.py
      - name: Install SHA-256 pinned Windows tools
        run: python ci/install_windows.py --output build/windows-tools --cache build/windows-downloads
      - name: Run native Configure and minimal build
        run: python ci/run_windows_checks.py --tools build/windows-tools --output build/windows-checks --external-root "$env:LOCALAPPDATA/Temp"
      - name: Upload native Windows diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-configure-build
          path: |
            build/windows-checks
            build/windows-tools/installed-lock.json
          if-no-files-found: error

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check result classification
        run: python3 -m unittest discover -s tests -p "test_firmware*.py"
      - name: Build compiler image
        run: |
          mkdir -p build/firmware-smoke build/firmware-qemu build/firmware-renode
          set -o pipefail
          docker build --platform linux/amd64 --progress plain -f ci/docker/Dockerfile -t stm32-yml-ci:firmware . 2>&1 | tee build/firmware-compiler-image.log
      # Separate builder (use: false): plain docker build above keeps the default engine.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
        with:
          use: false
      - name: Build emulator image (cached layers)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ci/emulation/Dockerfile
          platforms: linux/amd64
          tags: stm32-yml-emulation:firmware
          load: true
          cache-from: type=gha,scope=stm32-yml-emulation
          cache-to: type=gha,scope=stm32-yml-emulation,mode=max
      - name: Build firmware profiles on every locked GCC/CMake pair
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --mount "type=bind,source=$PWD/build/firmware-smoke,target=/results" \
            stm32-yml-ci:firmware python3 /workspace/ci/firmware_matrix.py build --output /results
      - name: Check pinned emulators offline
        run: docker run --rm --network none stm32-yml-emulation:firmware
      - name: Run QEMU with explicit result and timeout checks
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --mount "type=bind,source=$PWD/build/firmware-qemu,target=/results" \
            stm32-yml-emulation:firmware python3 /workspace/ci/firmware_matrix.py run \
              --build /workspace/build/firmware-smoke --output /results
      - name: Run the same ELFs in Renode
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --mount "type=bind,source=$PWD/build/firmware-renode,target=/results" \
            stm32-yml-emulation:firmware python3 /workspace/ci/firmware_matrix.py run \
              --emulator renode --build /workspace/build/firmware-smoke --output /results
      - name: Generate confirmed firmware counts
        run: |
          python3 ci/firmware_badge.py --build build/firmware-smoke --run build/firmware-qemu --renode-run build/firmware-renode \
            --output build/firmware-badge --revision "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Upload badge for publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-badge
          path: build/firmware-badge/
          if-no-files-found: error
          retention-days: 14
      - name: Upload build and execution diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-semihosting
          retention-days: 14
          path: |
            build/firmware-smoke/
            build/firmware-qemu/
            build/firmware-renode/
            build/firmware-*-image.log

  badge:
    concurrency:
      group: ci-badges
      cancel-in-progress: false
    needs: smoke
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download badge from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name firmware-badge --dir build/firmware-badge
      - name: Publish last successful main result
        run: python3 ci/publish_firmware_badge.py --directory build/firmware-badge
