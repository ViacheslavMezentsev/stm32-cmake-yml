name: Firmware

on:
  push:
    branches: [main, 'codex/**', 'claude/**']
    paths:
      - stm32_yml.cmake
      - cmake/**
      - scripts/**
      - ci/**
      - tests/firmware/**
      - tests/toolchains/**
      - tests/test_firmware*.py
      - .github/workflows/firmware.yml
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check result classification
        run: python3 -m unittest discover -s tests -p "test_firmware*.py"
      - name: Prepare result directories
        run: mkdir -p build/firmware-smoke build/firmware-qemu build/firmware-renode
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build compiler image (cached layers)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ci/docker/Dockerfile
          platforms: linux/amd64
          tags: stm32-yml-ci:firmware
          load: true
          cache-from: type=gha,scope=stm32-yml-ci
          cache-to: type=gha,scope=stm32-yml-ci,mode=max
      - name: Build emulator image (cached layers)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ci/emulation
          platforms: linux/amd64
          tags: stm32-yml-emulation:firmware
          load: true
          cache-from: type=gha,scope=stm32-yml-emulation
          cache-to: type=gha,scope=stm32-yml-emulation,mode=max
      - name: Build firmware profiles on every locked GCC/CMake pair
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --mount "type=bind,source=$PWD/build/firmware-smoke,target=/results" \
            stm32-yml-ci:firmware python3 /workspace/ci/firmware_matrix.py build --output /results
      - name: Check pinned emulators offline
        run: docker run --rm --network none stm32-yml-emulation:firmware
      - name: Run QEMU with explicit result and timeout checks
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --mount "type=bind,source=$PWD/build/firmware-qemu,target=/results" \
            stm32-yml-emulation:firmware python3 /workspace/ci/firmware_matrix.py run \
              --build /workspace/build/firmware-smoke --output /results
      - name: Run the same ELFs in Renode
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --mount "type=bind,source=$PWD/build/firmware-renode,target=/results" \
            stm32-yml-emulation:firmware python3 /workspace/ci/firmware_matrix.py run \
              --emulator renode --build /workspace/build/firmware-smoke --output /results
      - name: Generate confirmed firmware counts
        run: |
          python3 ci/firmware_badge.py --build build/firmware-smoke --run build/firmware-qemu --renode-run build/firmware-renode \
            --output build/firmware-badge --revision "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Upload badge for publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-badge
          path: build/firmware-badge/
          if-no-files-found: error
          retention-days: 14
      - name: Upload build and execution diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-semihosting
          retention-days: 14
          path: |
            build/firmware-smoke/
            build/firmware-qemu/
            build/firmware-renode/

  badge:
    concurrency:
      group: ci-badges
      cancel-in-progress: false
    needs: smoke
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download badge from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name firmware-badge --dir build/firmware-badge
      - name: Publish last successful main result
        run: python3 ci/publish_firmware_badge.py --directory build/firmware-badge
