name: Configure

on:
  push:
    branches: [main, 'claude/**', 'codex/**', 'gemini/**', 'dev/**']
    paths-ignore:
      - '**/*.md'
      - .github/FUNDING.yml
      - .github/ISSUE_TEMPLATE/**
      - docs/reference-index.json
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build test environment
        run: docker build --platform linux/amd64 --progress plain -f ci/docker/Dockerfile -t stm32-yml-ci:check .
      - name: Configure with all GCC and CMake versions offline
        run: |
          mkdir -p build/configure-tests
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --mount "type=bind,source=$PWD/build/configure-tests,target=/results" \
            stm32-yml-ci:check python3 /workspace/ci/run_configure_tests.py --output /results
      - name: Upload configure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: configure-diagnostics
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/configure-tests/summary.json
            build/configure-tests/*/configure-tests.log
            build/configure-tests/*/ctest.log
            build/configure-tests/*/Testing/Temporary/*.log
            build/configure-tests/*/cases/*/step-*/*
            build/configure-tests/*/cases/*/step-*/observed/*.txt
            build/configure-tests/*/cases/*/build/CMakeCache.txt
            build/configure-tests/*/cases/*/build/build.ninja
            build/configure-tests/*/cases/*/build/compile_commands.json
            build/configure-tests/*/cases/*/build/observed/*.txt
            build/configure-tests/*/cases/*/build/*.ld
            build/configure-tests/*/cases/*/build/CMakeFiles/CMakeConfigureLog.yaml
            build/configure-tests/*/cases/*/build/CMakeFiles/CMakeOutput.log
            build/configure-tests/*/cases/*/build/CMakeFiles/CMakeError.log
