name: Emulation environment

on:
  push:
    branches: [main, 'claude/**', 'codex/**', 'gemini/**', 'dev/**']
    paths:
      - ci/emulation/**
      - tools/qemu/**
      - .dockerignore
      - .github/workflows/emulation.yml
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulation-environment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test checker failure paths
        run: python3 -m unittest discover -s ci/emulation -p test_check.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
        with:
          use: false
      - name: Build pinned emulators from scratch and refresh the layer cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ci/emulation/Dockerfile
          platforms: linux/amd64
          tags: stm32-yml-emulation:check
          load: true
          no-cache: true
          cache-to: type=gha,scope=stm32-yml-emulation,mode=max
      - name: Prepare diagnostics directory
        run: mkdir -p build/emulation
      - name: Check release versions and machines offline
        run: |
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            --mount "type=bind,source=$PWD/build/emulation,target=/results" \
            stm32-yml-emulation:check python3 /opt/emulation/check.py --locked --output /results/environment.json
          docker run --rm --network none stm32-yml-emulation:check cat /opt/emulation/packages.txt > build/emulation/packages.txt
      - name: Upload environment diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulation-environment
          path: build/emulation/
          retention-days: 14
