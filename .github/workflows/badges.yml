name: Badges

on:
  workflow_run:
    workflows: [Configure, Firmware, Docs]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: ci-badges
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      # Only trusted default-branch code; no checkout/artifacts from triggering runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Refresh latest completed main statuses
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/workflow_badges.py --output build/workflow-badges --publish
