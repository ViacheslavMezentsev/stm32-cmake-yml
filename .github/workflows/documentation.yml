name: Docs

on:
  push:
    branches: [main, 'codex/**', 'claude/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate reference, translations and test mappings
        run: python3 ci/check_reference.py
