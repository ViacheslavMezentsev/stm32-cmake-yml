name: Docs

on:
  push:
    branches: [main, 'claude/**', 'codex/**', 'gemini/**', 'dev/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate reference, translations and test mappings
        run: python3 ci/check_reference.py
      - name: Validate framework messages against the catalog
        run: python3 ci/check_messages.py
      - name: Test the message check
        run: python3 -m unittest discover -s tests -p test_check_messages.py
      - name: Test component version detection
        run: python3 -m unittest discover -s tests -p test_component_versions.py
      - name: Test Configure matrix completeness and diagnostics
        run: python3 -m unittest discover -s tests -p test_configure_reports.py
      - name: Install configuration schema check dependencies
        run: |
          python3 -m venv .schema-venv
          .schema-venv/bin/python -m pip install -r ci/schema-requirements.txt
      - name: Validate generated schema and configuration fixtures
        run: .schema-venv/bin/python ci/check_schema.py
      - name: Test schema contracts and paired presets example
        run: .schema-venv/bin/python -m unittest discover -s tests -p test_config_schema.py
