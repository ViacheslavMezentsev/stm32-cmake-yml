name: CI environment

on:
  push:
    branches: [main, 'codex/**', 'claude/**']
    paths:
      - ci/**
      - .github/workflows/environment.yml
      - .gitattributes
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: environment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build pinned environment from scratch and refresh the layer cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ci/docker/Dockerfile
          platforms: linux/amd64
          tags: stm32-yml-ci:check
          load: true
          no-cache: true
          cache-to: type=gha,scope=stm32-yml-ci,mode=max
      - name: Verify without network access
        run: docker run --rm --network none stm32-yml-ci:check
      - name: Verify explicit version selection
        run: |
          docker run --rm --network none -e GCC_VERSION=13.3.1-1.1 -e CMAKE_VERSION=3.19.8 stm32-yml-ci:check cmake --version
          docker run --rm --network none -e GCC_VERSION=15.2.1-1.1 stm32-yml-ci:check arm-none-eabi-gcc --version
      - name: Reject unsupported version selection
        run: |
          if docker run --rm --network none -e GCC_VERSION=unknown stm32-yml-ci:check true; then
            echo 'Unsupported toolchain was accepted'
            exit 1
          fi
