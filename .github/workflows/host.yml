name: Host

on:
  push:
    branches: [main, 'claude/**', 'codex/**', 'gemini/**', 'dev/**']
    paths:
      - scripts/**
      - cmake/**
      - stm32_yml.cmake
      - tests/**
      - ci/run_host_checks.py
      - ci/install_windows.py
      - ci/windows.lock.json
      - .github/workflows/host.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run native diagnostic checks
        run: python ci/run_host_checks.py --output build/host-checks
      - name: Upload logs and tool versions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-${{ matrix.os }}
          path: build/host-checks
          if-no-files-found: error
