# FreeRTOS port selection from an IOC (spec 4.4.4, TC-60). No STM32Cube needed:
# the MCU is overridden per step and FreeRTOS-Kernel is used as external.
stm32_cmake_yml_version: 0.9.2
ioc_file: stm32f7-rtos.ioc
project_name: port_probe
languages: [C, ASM]
sources: [main.c]
use_cmsis: false
use_hal: false
freertos_version: external
cmsis_rtos_api: none
