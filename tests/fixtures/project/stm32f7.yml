# Synthetic configure-only F7 scenario.
stm32_cmake_yml_version: 0.9.3
project_name: stm32f7_probe
mcu: STM32F746NG
languages: [C, ASM]
sources: [main.c]
include_directories: [include]
use_cmsis: true
use_hal: true
hal_components: [GPIO]
cubefw_package: V1.17.3
profiles:
  rtos:
    ioc_file: stm32f7-rtos.ioc
