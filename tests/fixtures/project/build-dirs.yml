# Build directories of added directories (spec 4.6.8, TC-78). The case key
# "extra_dirs" creates the directories inside and outside the project.
stm32_cmake_yml_version: 0.10.1
project_name: baremetal_probe
mcu: STM32F103C8T6
languages: [C, ASM]
sources: [main.c]
use_cmsis: false
use_hal: false
use_freertos: false
use_newlib_nano: false
heap_size: 0
stack_size: 1K
linker_script_dir: linker
compile_options: [mcpu=cortex-m3, mthumb]
profiles:
  external:
    sources_append: [Module, ../modules/etl]
  samekey:
    sources_append: [../modules/etl, ../../modules/etl]
  nested:
    sources_append: [../a/x, ../a/x/y, ../a/xy]
  depsclash:
    sources_append: [_deps/local, ../modules/etl]
