stm32_cmake_yml_version: 0.9.3
project_name: baremetal_probe
mcu: STM32F103C8T6
languages: [C, ASM]
sources: [main.c]
use_cmsis: false
use_hal: false
use_freertos: false
use_newlib_nano: false
crc_enable: false
heap_size: 0
stack_size: 1K
linker_script_dir: linker
compile_options: [mcpu=cortex-m3, mthumb]
compile_definitions: [BAREMETAL=1]
include_directories: []
profiles:
  empty:
    compile_definitions: []
  emptyappend:
    compile_definitions_append: []
  replaceappend:
    compile_definitions: []
    compile_definitions_append: [ONLY_APPEND=1]
  sized:
    heap_size: 512
    stack_size: 2K
  Rev:
    stack_size: 2K
    compile_definitions: [REV=1]
    sources: [main.c]
  RevB:
    stack_size: 4K
    compile_definitions: [REVB=1]
    sources: [main.c, extra.c]
