stm32_cmake_yml_version: 0.9.3
project_name: arduino_probe
toolchain_backend: arduino
mcu: STM32F411CE
languages: [C, CXX, ASM]
sources: [main.c, helper.cpp]
compile_definitions: [STM32F411xE, ARDUINO_BASE=1]
compile_options: [mcpu=cortex-m4, mthumb]
linker_script_dir: linker
arduino:
  core_path: modules/Arduino_Core_STM32
  mcu_target: F411
  use_core_main: false
  libraries: []
  custom_libraries: [custom/hal/driver, custom/app/driver]
link_libraries: [Custom::App]
compile_options_c: [Wstrict-prototypes]
compile_options_cxx: [fno-exceptions]
profiles:
  unlinked:
    link_libraries: [Arduino::Core]
  missing:
    arduino:
      custom_libraries: [custom/missing]
    link_libraries: [Arduino::Core]
  nowrap:
    arduino:
      custom_libraries: [custom/no-wrapper]
    link_libraries: [Arduino::Core]
  empty:
    arduino:
      custom_libraries: []
    link_libraries: [Arduino::Core]
