# Synthetic configure-only G4 scenario.
stm32_cmake_yml_version: 0.9.2
project_name: stm32g4_probe
mcu: STM32G431CB
languages: [C, ASM]
sources: [main.c]
include_directories: [include]
use_cmsis: true
use_hal: true
hal_components: [GPIO]
cubefw_package: V1.6.3
profiles:
  rtos:
    ioc_file: stm32g4-rtos.ioc
