# TC-96: equivalent to report.yml; the IOC intentionally omits heap_size.
stm32_cmake_yml_version = "0.10.2"
ioc_file = "report.ioc"
mcu = "STM32F103C8T6"
languages = ["C", "ASM"]
sources = ["main.c"]
use_cmsis = true
use_hal = false

[profiles.Demo]
heap_size = "1K"
stack_size = "2K"
use_freertos = true
cmsis_rtos_api = "none"
freertos_components = ["ARM_CM3", "Heap::2"]
