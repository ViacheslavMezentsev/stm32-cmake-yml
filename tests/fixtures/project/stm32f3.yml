# Synthetic configure-only F3 scenario.
stm32_cmake_yml_version: 0.9.2
project_name: stm32f3_probe
mcu: STM32F303VC
languages: [C, ASM]
sources: [main.c]
include_directories: [include]
use_cmsis: true
use_hal: true
hal_components: [GPIO]
cubefw_package: V1.11.5
profiles:
  rtos:
    ioc_file: stm32f3-rtos.ioc
