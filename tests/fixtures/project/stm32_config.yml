stm32_cmake_yml_version: 0.9.2
project_name: configure_probe
mcu: STM32F411CE
languages: [C, CXX, ASM]
c_standard: 11
cpp_standard: 17
sources: [main.c, helper.cpp]
include_directories: [include]
compile_definitions: [BASE=1]
compile_options: [Wall]
compile_options_c: [Wstrict-prototypes]
compile_options_cxx: [fno-exceptions]
compile_definitions_c: [ONLY_C=1]
compile_definitions_cxx: [ONLY_CXX=1]
use_cmsis: true
use_hal: true
hal_components: [GPIO]
cubefw_package: V1.28.3
system_library: NoSys
profiles:
  append:
    compile_definitions_append: [APPENDED=1]
    sources_append: [extra.c]
    stack_size: 2K
  replace:
    compile_definitions: [REPLACED=1]
    compile_definitions_append: [AFTER_REPLACE=1]
    sources: [main.c]
    sources_append: [extra.c]
  template:
    linker_script_dir: linker
    heap_size: 1K
    stack_size: 2K
  crc:
    linker_script_dir: linker
    crc_enable: true
    crc_section_name: .checksum
    crc_algorithm: STM32_HW_DEFAULT
  crcnoscript:
    crc_enable: true
  crcexplicit:
    linker_script_dir: linker
    linker_script: custom.ld
    crc_enable: true
  crcnoflash:
    linker_script_dir: linker
    linker_script: diagnostic-no-ram.ld
    crc_enable: true
  bluepill:
    mcu: STM32F103C8
    cubefw_package: V1.8.7
