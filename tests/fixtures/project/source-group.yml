stm32_cmake_yml_version: 0.9.3
project_name: source_group_probe
mcu: STM32F103C8T6
languages: [C, CXX, ASM]
sources: [main.c, SourceGroup]
use_cmsis: false
use_hal: false
use_freertos: false
use_newlib_nano: false
linker_script_dir: linker
compile_options: [mcpu=cortex-m3, mthumb, Wall]
compile_options_c: [Wstrict-prototypes]
compile_options_cxx: [fno-exceptions]
compile_definitions: [COMMON_SOURCE=1]
compile_definitions_c: [C_SOURCE=1]
compile_definitions_cxx: [CXX_SOURCE=1]
profiles:
  missing:
    sources_append: [absent.c]
  nodirectorycmake:
    sources_append: [WithoutCMake]
