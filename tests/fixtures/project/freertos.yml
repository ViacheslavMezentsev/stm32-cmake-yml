# Configure-only FreeRTOS contract; no runnable firmware or RTOS config header.
stm32_cmake_yml_version: 0.9.2
project_name: freertos_probe
mcu: STM32F411CE
languages: [C, ASM]
sources: [main.c]
use_cmsis: true
use_hal: false
use_freertos: true
cubefw_package: V1.28.3
freertos_components: [ARM_CM4F, Heap::4, Timers, EventGroups, StreamBuffer]
profiles:
  gcs:
    freertos_version: cube
    cmsis_rtos_api: v2
  demo:
    freertos_version: cube
    cmsis_rtos_api: v2
    freertos_components: [ARM_CM4F, Heap::2, Timers, EventGroups, StreamBuffer]
  legacy:
    cmsis_rtos_api: v1
  noport:
    freertos_components: [Heap::4]
  twoports:
    freertos_components: [ARM_CM4F, ARM_CM3, Heap::4]
  missing:
    freertos_components: [ARM_CM4F, MissingComponent]
  disabled:
    use_freertos: false
    freertos_components: [ARM_CM4F, ARM_CM3, MissingComponent]
