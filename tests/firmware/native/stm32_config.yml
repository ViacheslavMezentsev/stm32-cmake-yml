# Arduino native mode firmware; the MCU of each target is passed with
# -DSTM32_YML_OVERRIDE_mcu=..., the core path with
# -DSTM32_YML_OVERRIDE_arduino_core_path=... (ci/build_firmware_smoke.py).
stm32_cmake_yml_version: 0.9.3
project_name: native_probe
toolchain_backend: arduino
mcu: STM32F103C8T6
languages: [C, CXX, ASM]
sources: [sketch.cpp]
compile_definitions: [NATIVE_FIRMWARE=1]
build_artifacts: [bin, hex, map]
arduino:
  integration: native
  core_path: modules/Arduino_Core_STM32
profiles:
  native:
    arduino:
      use_core_main: true
  nativeOwnMain:
    sources: [own_main.cpp]
    arduino:
      use_core_main: false
      libraries: [Wire]
    link_libraries: [Wire]
