stm32_cmake_yml_version: 0.9.2
project_name: semihosting_smoke
mcu: STM32F103C8T6
heap_size: 512
stack_size: 1K
sources: [system_stm32f1xx.c, main.cpp]
include_directories: [.]
use_cmsis: true
use_hal: true
hal_components: [CORTEX]
cubefw_package: V1.8.7
languages: [C, CXX, ASM]
c_standard: 11
cpp_standard: 17
compile_options: [Os, g3]
linker_directives: [--print-memory-usage, --no-warn-rwx-segments]
use_newlib_nano: true
system_library: Semihosting
build_artifacts: [bin, hex, map, lss]
crc_enable: true
crc_algorithm: STM32_HW_DEFAULT
linker_script: STM32F103C8_FLASH.ld
validate_linker_script: true
# Seed dynamic keys so profile values are exported (E008).
compile_options_c: []
compile_options_cxx: []
compile_definitions_c: []
compile_definitions_cxx: []
profiles:
  success:
    compile_definitions: [SMOKE_SUCCESS=1]
  failure:
    compile_definitions: [SMOKE_FAIL=1]
  hang:
    compile_definitions: [SMOKE_HANG=1]
  bare:
    use_cmsis: false
    use_hal: false
    sources: [bare_startup.S, main.cpp]
    compile_definitions: [SMOKE_BARE=1]
    compile_options_append: [mcpu=cortex-m3, mthumb, mfloat-abi=soft, ffunction-sections, fdata-sections]
    link_options: [mcpu=cortex-m3, mthumb, mfloat-abi=soft, nostartfiles]
  bareTemplate:
    use_cmsis: false
    use_hal: false
    sources: [bare_startup.S, main.cpp]
    compile_definitions: [SMOKE_BARE=1]
    compile_options_append: [mcpu=cortex-m3, mthumb, mfloat-abi=soft, ffunction-sections, fdata-sections]
    link_options: [mcpu=cortex-m3, mthumb, mfloat-abi=soft, nostartfiles]
    linker_script: auto
    heap_size: 0
    stack_size: 2K
  cmsis:
    use_hal: false
  cmsisTemplate:
    use_hal: false
    linker_script: auto
    heap_size: 0
    stack_size: 2K
  cmsisLibrary:
    use_hal: false
    sources_append: [Library, language_probe.c]
    link_libraries: [Smoke::Library]
    compile_definitions: [SMOKE_LIBRARY=1]
    compile_definitions_c: [SMOKE_C_ONLY=1]
    compile_definitions_cxx: [SMOKE_CXX_ONLY=1]
    compile_options_c: [Wstrict-prototypes]
    compile_options_cxx: [fno-exceptions, fno-rtti]
  cmsisEtl:
    use_hal: false
    sources_append: [Library, language_probe.c]
    link_libraries: [Smoke::Library]
    compile_definitions: [SMOKE_LIBRARY=1, SMOKE_ETL=1]
    compile_definitions_c: [SMOKE_C_ONLY=1]
    compile_definitions_cxx: [SMOKE_CXX_ONLY=1]
    compile_options_c: [Wstrict-prototypes]
    compile_options_cxx: [fno-exceptions, fno-rtti]
  arduinoString:
    toolchain_backend: arduino
    use_cmsis: false
    use_hal: false
    sources: [bare_startup.S, main.cpp, arduino_string.cpp, heap.c]
    compile_definitions: [SMOKE_BARE=1, SMOKE_ARDUINO=1]
    compile_options_append: [mcpu=cortex-m3, mthumb, mfloat-abi=soft, ffunction-sections, fdata-sections, specs=nano.specs]
    compile_options_cxx: [fno-exceptions, fno-rtti]
    link_options: [mcpu=cortex-m3, mthumb, mfloat-abi=soft, nostartfiles, specs=nano.specs, specs=nosys.specs]
    link_libraries: [Arduino::Core]
    linker_directives_append: [--gc-sections]
    use_newlib_nano: false
    system_library: none
    arduino:
      core_cmake_dir: ArduinoString
      mcu_target: F103
      use_core_main: false
  freertosQueue:
    use_hal: false
    use_freertos: true
    freertos_version: cube
    cmsis_rtos_api: none
    freertos_components: [ARM_CM3, Heap::4]
    sources: [system_stm32f1xx.c, main.cpp, freertos_queue.c]
    compile_definitions: [SMOKE_FREERTOS=1]
  freertosTasks:
    use_hal: false
    use_freertos: true
    freertos_version: cube
    cmsis_rtos_api: none
    freertos_components: [ARM_CM3, Heap::4]
    sources: [system_stm32f1xx.c, main.cpp, freertos_tasks.c]
    compile_definitions: [SMOKE_RTOS_TASKS=1]
