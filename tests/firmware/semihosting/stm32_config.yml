stm32_cmake_yml_version: 0.9.2
project_name: semihosting_smoke
mcu: STM32F103C8T6
heap_size: 512
stack_size: 1K
sources: [system_stm32f1xx.c, main.cpp]
include_directories: [.]
use_cmsis: true
use_hal: true
hal_components: [CORTEX]
cubefw_package: V1.8.7
languages: [C, CXX, ASM]
c_standard: 17
cpp_standard: 17
compile_options: [Os, g3]
linker_directives: [--print-memory-usage, --no-warn-rwx-segments]
use_newlib_nano: true
system_library: Semihosting
build_artifacts: [bin, hex, map, lss]
crc_enable: false
validate_linker_script: true
profiles:
  success:
    compile_definitions: [SMOKE_SUCCESS=1]
  failure:
    compile_definitions: [SMOKE_FAIL=1]
  hang:
    compile_definitions: [SMOKE_HANG=1]
